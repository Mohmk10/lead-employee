# --- Connexion Neon Postgres ---
hibernate.connection.url=jdbc:postgresql://<host>/<database>?sslmode=require&channelBinding=require
hibernate.connection.username=<username>
hibernate.connection.password=<password>
hibernate.connection.driver_class=org.postgresql.Driver

# --- HikariCP (pool Neon) ---
hibernate.hikari.maximumPoolSize=5
hibernate.hikari.minimumIdle=1
hibernate.hikari.idleTimeout=300000
hibernate.hikari.maxLifetime=1700000
hibernate.hikari.keepaliveTime=300000

# --- Hibernate / JPA ---
# Dialect auto-détecté par Hibernate 6, mais gardé ici pour clarté
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=validate
hibernate.show_sql=false
hibernate.format_sql=true

# --- Provider Hibernate <-> Hikari ---
hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
